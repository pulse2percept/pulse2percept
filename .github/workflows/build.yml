name: Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} Py ${{ matrix.python-version }}${{ matrix.torch && format(' torch{0}', matrix.torch) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Test the declared minimum torch (pyproject.toml) with NumPy 2; all
        # other jobs use the latest release. macOS also checks that the
        # extensions share that torch wheel's OpenMP runtime:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            torch: "==2.4.1"
          - os: macos-latest
            python-version: "3.11"
            torch: "==2.4.1"

    # Force bash on all OSes (avoids PowerShell var-expansion issues on Windows)
    defaults:
      run:
        shell: bash

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # ---- System deps ----
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev zlib1g-dev libjpeg-turbo8-dev

      # ---- Bootstrap build toolchain + NumPy headers ----
      - name: Upgrade pip and bootstrap build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=64" wheel "Cython>=3.0.8" "numpy>=2,<3"
          python -c "import numpy, sys; print('Build NumPy', numpy.__version__, 'on', sys.version)"

      # ---- Lint ----
      - name: Lint with flake8
        run: |
          python -m pip install flake8
          flake8 pulse2percept --ignore N802,N806,W504 --select W503,W605 --count --show-source --statistics

      # Satisfy the torch dependency with CPU-only wheels; PyPI's Linux wheels
      # pull in CUDA. Windows/macOS PyPI wheels are CPU-only already.
      - name: Install PyTorch (Linux, CPU-only)
        if: runner.os == 'Linux'
        run: python -m pip install "torch${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu

      # macOS extensions link torch's OpenMP runtime, so torch must be
      # installed before the build (see setup.py):
      - name: Install PyTorch (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install "torch${{ matrix.torch }}"

      # ---- Install package (editable) with dev extras ----
      # Use --no-build-isolation so Cython uses the preinstalled NumPy headers.
      - name: Install package (editable + dev extras)
        run: |
          python -m pip install -e ".[dev]" --no-build-isolation
          python -c "import numpy, pulse2percept as p2p; print('Runtime NumPy', numpy.__version__); print('p2p version:', getattr(p2p, '__version__', 'unknown'))"

      - name: Check OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: python .github/scripts/check_openmp.py

      # ---- Log env ----
      - name: Log environment info
        run: |
          python --version
          pip show numpy
          pip show scipy || true
          pip show pulse2percept
          pip freeze | sed -n '1,120p'

      # ---- Tests ----
      # Run from an empty directory so that `--pyargs` tests the installed
      # package rather than the source tree next to it.
      - name: Run test suite
        run: |
          mkdir -p test_dir && cd test_dir
          pytest --pyargs pulse2percept --cov=pulse2percept --cov-branch --cov-report=xml --doctest-modules -x

      # Run expensive integration tests once per PR and append their coverage:
      - name: Run slow tests
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          cd test_dir
          pytest --pyargs pulse2percept --cov=pulse2percept --cov-append --cov-branch --cov-report=xml --runslow -m slow -x

      # ---- Coverage upload ----
      - name: Upload coverage report to codecov.io
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pulse2percept/pulse2percept
