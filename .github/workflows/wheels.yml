name: Wheels

on:
  push:
    branches: [ master, torch ]
    tags: [ v* ]
  pull_request:
    branches: [ master, torch ]

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev zlib1g-dev libjpeg-turbo8-dev

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          # macOS: the extensions link torch's bundled libomp, which the
          # isolated build installs from pyproject.toml (see setup.py).
          CIBW_BEFORE_BUILD_MACOS: "python -m pip install --upgrade pip delocate"

          # macOS 11 is the minimum for Apple silicon.
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"

          # Do not vendor libomp: at runtime it must resolve to torch's copy,
          # or two OpenMP runtimes abort the process. The build-time torch is
          # gone by now, so libomp cannot be resolved here; the test below
          # checks it is the only non-system dependency.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-listdeps --all --depending {wheel} &&
            delocate-wheel --require-archs {delocate_archs} --exclude libomp
            --ignore-missing-dependencies -w {dest_dir} -v {wheel}

          # The installed wheel must share torch's OpenMP runtime:
          CIBW_TEST_COMMAND_MACOS: "python {project}/.github/scripts/check_openmp.py"

          # Linux
          CIBW_ENVIRONMENT_LINUX: "CFLAGS='-fopenmp'"
          CIBW_BEFORE_BUILD_LINUX: "python -m pip install --upgrade pip setuptools wheel cython 'numpy>=2.0'"

          # Windows
          CIBW_ENVIRONMENT_WINDOWS: "CFLAGS='/openmp'"
          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install --upgrade pip setuptools wheel cython \"numpy>=2.0\""

          # Free-threaded cp314t builds are intentionally excluded.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-manylinux_i686 *-win32 *musllinux*"

          # No Intel-Mac wheels: PyTorch, a runtime dependency, has none
          # since 2.3.
          CIBW_ARCHS_MACOS: "arm64"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl