version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # Patch bumps (3.0.1 -> 3.0.2) are noise; minor/major still come through
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    groups:
      # The codeql-action sub-actions (init/autobuild/analyze/upload-sarif) are
      # versioned together and must all run at the same version, otherwise the
      # Analyze job fails with InconsistentActionVersion
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else lands in a single PR per week
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /doc
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    groups:
      doc-requirements:
        patterns:
          - "*"
