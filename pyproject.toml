[build-system]
requires = [
  "setuptools>=64",
  "wheel",
  "Cython>=3.0.8",
  # Build against NumPy 2.x on every supported Python, not just 3.12+.
  #
  # An extension compiled against 2.x imports fine under both 1.x (>=1.19)
  # and 2.x, because building against 2.x targets the older C API by default.
  # One compiled against 1.x does *not* work under 2.x -- it raises "A module
  # that was compiled using NumPy 1.x cannot be run in NumPy 2.x". Since the
  # runtime requirement below allows numpy>=1.23.2,<3, the 3.11 wheels built
  # against oldest-supported-numpy broke for anyone who had numpy 2
  # installed, which is now the default nearly everywhere.
  #
  # oldest-supported-numpy is deprecated and documents this as the migration.
  "numpy>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pulse2percept"
version = "0.9.2.dev0"
description = "A Python-based simulation framework for bionic vision"
readme = "README.rst"
license = { file = "LICENSE" }
authors = [
    { name = "Michael Beyeler", email = "mbeyeler@ucsb.edu" },
    { name = "Jacob Granley", email = "jgranley@ucsb.edu" },
    { name = "Apurv Varshney", email = "apurv@ucsb.edu" },
    { name = "Ariel Rokem", email = "arokem@gmail.com" }
]
keywords = ["bionic vision", "simulation", "scientific computing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.11"
# Lower bounds are the first release of each package that ships wheels for the
# oldest Python we support. Anything older cannot be installed on 3.11 anyway,
# so declaring it only makes the metadata claim something we never test.
# Revisit these whenever the minimum Python moves.
dependencies = [
    "numpy>=1.23.2,<3",
    "scipy>=1.9.2",
    "scikit-image>=0.20",
    "matplotlib>=3.6",
    "imageio-ffmpeg>=0.4",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "h5py",
    "pytest>=5",
    "pytest-cov",
    "flake8",
    "seaborn",
    "neuropythy"
]
# (Optional) convenience extra for docs/Colab how-tos
colab = [
    "numpy>=2,<3"
]

[tool.coverage.run]
# Measure coverage of the library, not of the test suite itself: test modules
# that are skipped (e.g. because an optional dataset isn't available) would
# otherwise report as large blocks of uncovered code.
omit = [
    "*/tests/*",
    "*/conftest.py",
]

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.package-data]
"pulse2percept.stimuli" = ["data/*"]
"pulse2percept.datasets" = ["data/*"]
"pulse2percept.viz" = ["data/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse2percept", "pulse2percept.*"]
exclude = ["wheelhouse", "tests", "*/tests"]
