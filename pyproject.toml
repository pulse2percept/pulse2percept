[build-system]
requires = [
  "setuptools>=64",
  "wheel",
  # 3.1.3 is the first Cython release with Python 3.14 wheels; older ones
  # cannot target 3.14.
  "Cython>=3.1.3",
  # Build and run on NumPy 2.x, which is also the runtime requirement below.
  #
  # An extension compiled against 1.x cannot be imported under 2.x -- it
  # raises "A module that was compiled using NumPy 1.x cannot be run in NumPy
  # 2.x" -- which is how the old oldest-supported-numpy builds broke for
  # anyone who had NumPy 2 installed, now the default nearly everywhere.
  # oldest-supported-numpy is deprecated and documents this as the migration.
  "numpy>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pulse2percept"
version = "0.11.0dev"
description = "A Python-based simulation framework for bionic vision"
readme = "README.rst"
license = { file = "LICENSE" }
authors = [
    { name = "Michael Beyeler", email = "mbeyeler@ucsb.edu" },
    { name = "Jacob Granley", email = "jgranley@ucsb.edu" },
    { name = "Apurv Varshney", email = "apurv@ucsb.edu" },
    { name = "Ariel Rokem", email = "arokem@gmail.com" }
]
keywords = ["bionic vision", "simulation", "scientific computing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.11"
# Lower bounds are the first release of each package that supports NumPy 2 on
# the oldest Python we support. Older releases were compiled against the NumPy
# 1.x ABI and fail to import next to the NumPy required here, so declaring
# them would only make the metadata promise something that cannot work.
# Revisit whenever the minimum Python or the minimum NumPy moves.
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "matplotlib>=3.9",
    "imageio-ffmpeg>=0.4",
    "pandas>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "h5py",
    "pytest>=5",
    "pytest-cov",
    "flake8",
    "seaborn",
    "neuropythy"
]
# Kept out of `dev` so the test matrix does not install a runner it never uses;
# see benchmarks/README.md.
benchmark = [
    "pytest-benchmark>=4",
]

[tool.coverage.run]
# Measure coverage of the library, not of the test suite itself: test modules
# that are skipped (e.g. because an optional dataset isn't available) would
# otherwise report as large blocks of uncovered code.
omit = [
    "*/tests/*",
    "*/conftest.py",
]

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.package-data]
"pulse2percept.stimuli" = ["data/*"]
"pulse2percept.datasets" = ["data/*"]
"pulse2percept.viz" = ["data/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse2percept", "pulse2percept.*"]
exclude = ["wheelhouse", "tests", "*/tests"]
