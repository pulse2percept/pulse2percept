coverage:
  status:
    changes: false
    patch: false
    project:
      default:
        target: auto
        threshold: 5.0

# `ignore` is a top-level key: nested under `coverage.status` it is silently
# dropped, which is how test modules ended up in the report. One glob covers
# every tests/ directory, including ones added later.
ignore:
  - "pulse2percept/**/tests/**/*"
  - "**/conftest.py"